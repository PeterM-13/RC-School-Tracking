<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css?v=2026-05-01-1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <title>School Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-api.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <header>
        <h1><span style="color: rgb(220, 56, 56);">Rampaging Chariots</span><br>Construction Tracking</h1>
        <img id="logo" src="images/logo.svg" alt="Logo" onclick="window.location.href='./index.html'" style="cursor: pointer;">
    </header>

    <main>
        <h2>Select your school</h2>
        <select id="school-dropdown">
            <option value="" disabled selected>Select a school</option>
        </select>

        <h2>Enter password</h2>
        <div class="pswd-row">
          <input id="pswd" type="text" placeholder="Enter password">
          <span id="toggle-pswd" class="toggle-pswd">Show</span>
        </div>

        <button id="login-button">Start Building</button>
        <p id="login-message" class="login-message" aria-live="polite"></p>
        <p id="loading">Loading, please wait...</p>
    </main>

    <script>
        const LOADING_ERROR_MESSAGE = 'LOADING ERROR. Please try again later.';

        // ========================================
        // Utility Functions
        // ========================================

        /*
         * Animates loading dots in the loading element
         */
        function startLoadingAnimation() {
          const loadingElement = document.getElementById('loading');
          let dotCount = 0;

          setInterval(() => {
            if (loadingElement.style.display === 'block' && 
                loadingElement.textContent !== LOADING_ERROR_MESSAGE) {
              dotCount = (dotCount + 1) % 4;
              loadingElement.textContent = 'Loading, please wait' + '.'.repeat(dotCount);
            }
          }, 500);
        }

        /*
         * Validates that school and password are provided
         * @returns {boolean} - True if both values are provided
         */
        function validateLoginInputs() {
          const selectedSchool = document.getElementById('school-dropdown').value;
          const password = document.getElementById('pswd').value;

          if (!selectedSchool || !password) {
            showLoginMessage('Please select a school and enter a password.');
            return false;
          }
          return true;
        }

        function showLoginMessage(message) {
          const messageElement = document.getElementById('login-message');
          messageElement.textContent = message;
          messageElement.style.display = 'block';
        }

        function clearLoginMessage() {
          const messageElement = document.getElementById('login-message');
          messageElement.textContent = '';
          messageElement.style.display = 'none';
        }

        /*
         * Populates the school dropdown with sorted schools
         */
        async function populateSchoolDropdown() {
          const loadingElement = document.getElementById('loading');
          const dropdown = document.getElementById('school-dropdown');
          const loadingDelay = setTimeout(() => {
            loadingElement.style.display = 'block';
          }, 500);
          //loadingElement.style.display = 'block';

          try {
            const schools = await RcApi.getSchoolNames();

            // Sort schools: Admin at the end, others alphabetically
            schools.sort((schoolA, schoolB) => {
              if (schoolA === 'Admin') return 1;
              if (schoolB === 'Admin') return -1;
              return schoolA.localeCompare(schoolB);
            });

            schools.forEach(school => {
              const option = document.createElement('option');
              option.value = school;
              option.textContent = school;
              dropdown.appendChild(option);
            });

            clearTimeout(loadingDelay);
            loadingElement.style.display = 'none';
          } catch (error) {
            clearTimeout(loadingDelay);
            console.error('Error fetching schools:', error);
            loadingElement.style.display = 'block';
            loadingElement.textContent = LOADING_ERROR_MESSAGE;
          }
        }

        /*
         * Attempts to log in the user with provided credentials
         */
        async function handleLogin() {
          const selectedSchool = document.getElementById('school-dropdown').value;
          const password = document.getElementById('pswd').value;
          const loadingElement = document.getElementById('loading');

          clearLoginMessage();

          if (!validateLoginInputs()) {
            return;
          }

          try {
            const result = await RcApi.verifySchoolPassword(selectedSchool, password);

            if (result.success) {
              const targetPage = selectedSchool === 'Admin' ? 'admin.html' : 'school-progress.html';
              RcAuth.setAuthSession({
                school: selectedSchool,
                key: password,
                adminKey: selectedSchool === 'Admin' ? password : null
              });
              window.location.href = targetPage;
            } else {
              loadingElement.style.display = 'none';
              showLoginMessage('Incorrect password for selected school. Please try again.');
            }
          } catch (error) {
            console.error('Error during login:', error);
            alert('An error occurred. Please try again later.');
            loadingElement.style.display = 'none';
          }
        }

        // ========================================
        // Initialisation
        // ========================================

        document.addEventListener('DOMContentLoaded', () => {
          startLoadingAnimation();
          populateSchoolDropdown();

          const loginButton = document.getElementById('login-button');
          loginButton.addEventListener('click', handleLogin);

          const passwordInput = document.getElementById('pswd');
          const togglePswd = document.getElementById('toggle-pswd');
          const loginMessage = document.getElementById('login-message');

          // Toggle show/hide when clicking the text
          togglePswd.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
              passwordInput.type = 'text';
              togglePswd.textContent = 'Hide';
            } else {
              passwordInput.type = 'password';
              togglePswd.textContent = 'Show';
            }
          });

          passwordInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              loginButton.click();
            }
          });

          passwordInput.addEventListener('input', () => {
            if (loginMessage.textContent) {
              clearLoginMessage();
            }
          });

          const dropdown = document.getElementById('school-dropdown');
          dropdown.addEventListener('change', () => {
            const selectedSchool = dropdown.value;

            clearLoginMessage();

            if (selectedSchool === 'Admin') {
              // Admin: obscure by default and show the toggle control
              passwordInput.type = 'password';
              passwordInput.value = '';
              togglePswd.style.display = 'inline';
              togglePswd.textContent = 'Show';
            } else {
              // Non-admin: plain text, hide toggle
              passwordInput.type = 'text';
              togglePswd.style.display = 'none';

              if (selectedSchool && !passwordInput.value.trim()) {
                passwordInput.value = selectedSchool.replace(/\s+/g, '').toLowerCase();
              }
            }
          });
        });
    </script>
</body>
</html>
