<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="3dView.css?v=2026-02-25-3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <title>3D View</title>
    <script src="js/auth.js"></script>
</head>

<body>
    <header>
        <h1><span style="color: rgb(220, 56, 56);">Rampaging Chariots</span><br>Construction Tracking</h1>
        <img id="logo" src="images/logo.svg" alt="Logo" onclick="window.location.href='./index.html'" style="cursor: pointer;">
        <link rel="icon" href="images/favicon.ico" type="image/x-icon">
        <a id="back" href="./school-progress.html">Back</a>
    </header>

    <div id="status">Loading model...</div>
    <canvas id="viewer"></canvas>
    <div id="annotationLayer" aria-hidden="true">
        <svg id="annotationSvg"></svg>
        <div id="annotationLabels"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

        const canvas = document.getElementById("viewer");
        const statusEl = document.getElementById("status");
        const headerEl = document.querySelector("header");
        const backLink = document.getElementById("back");
        const annotationLayer = document.getElementById("annotationLayer");
        const annotationSvg = document.getElementById("annotationSvg");
        const annotationLabels = document.getElementById("annotationLabels");
        const projectedPoint = new THREE.Vector3();
        const tmpWorldPoint = new THREE.Vector3();
        const raycaster = new THREE.Raycaster();
        let occluderMeshes = [];

        // Add more annotations in this array.
        const annotationConfigs = [
            {
                id: "motor",
                label: "Drill Motor",
                targetNameIncludes: "motor",
                fallbackFromBounds: { x: 0.06, y: -0.082, z: -0.21 },
                labelOffset: { x: 72, y: -48 },
                occlusionPadding: 0.06,
                enableOcclusion: true,
                enableOcclusionForFallback: true
            },
            {
                id: "pcb",
                label: "PCB",
                targetNameIncludes: "pcb",
                fallbackFromBounds: { x: 0.0, y: -0.2, z: 0.315 },
                labelOffset: { x: 72, y: -48 },
                occlusionPadding: 0.06,
                enableOcclusion: true,
                enableOcclusionForFallback: true
            },
            {
                id: "battery",
                label: "Drill Batteries",
                targetNameIncludes: "battery",
                fallbackFromBounds: { x: 0.06, y: -0.05, z: -0.01 },
                labelOffset: { x: 72, y: -48 },
                occlusionPadding: 0.06,
                enableOcclusionForFallback: true
            },
            {
                id: "receiver",
                label: "Receiver",
                targetNameIncludes: "receiver",
                fallbackFromBounds: { x: 0.42, y: 0.1, z: 0.0 },
                labelOffset: { x: 72, y: -48 },
                occlusionPadding: 0.06,
                enableOcclusionForFallback: true
            },
            {
                id: "fuse",
                label: "Fuse",
                targetNameIncludes: "fuse",
                fallbackFromBounds: { x: -0.171, y: -0.225, z: -0.14 },
                labelOffset: { x: 72, y: -48 },
                occlusionPadding: 0.06,
                enableOcclusionForFallback: true
            }
        ];
        const annotations = [];

        backLink.addEventListener("click", (event) => {
            event.preventDefault();
            window.location.href = './school-progress.html';
        });

        if (!RcAuth.requireAuthSession()) {
            throw new Error('Missing school login details.');
        }

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4F4F4F);

        const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 1000);
        camera.position.set(2, 1.5, 3);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x404040, 1.1);
        scene.add(hemiLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(4, 8, 6);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
        fillLight.position.set(-5, 3, -4);
        scene.add(fillLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enablePan = true;
        controls.zoomSpeed = 0.8;
        controls.rotateSpeed = 0.7;
        controls.target.set(0, 0, 0);

        function resizeRenderer() {
            const width = window.innerWidth;
            const height = Math.max(window.innerHeight - headerEl.offsetHeight, 1);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(width, height, false);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }

        function frameModel(object3D) {
            const box = new THREE.Box3().setFromObject(object3D);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = THREE.MathUtils.degToRad(camera.fov);
            const fitDistance = maxDim / (2 * Math.tan(fov / 2));
            const distance = fitDistance * 0.6;
            const defaultAzimuth = -Math.PI / 0.88;

            camera.position.set(
                center.x + Math.cos(defaultAzimuth) * distance,
                center.y + distance * 1.6,
                center.z + Math.sin(defaultAzimuth) * distance
            );
            camera.near = Math.max(distance / 100, 0.01);
            camera.far = distance * 100;
            camera.updateProjectionMatrix();

            controls.target.copy(center);
            controls.minDistance = distance * 0.2;
            controls.maxDistance = distance * 6;
            controls.update();
        }

        function hideAnnotation(annotation) {
            annotation.labelEl.style.display = "none";
            annotation.lineEl.style.display = "none";
        }

        function getNodeDepth(node) {
            let depth = 0;
            let current = node;
            while (current?.parent) {
                depth += 1;
                current = current.parent;
            }
            return depth;
        }

        function collectMeshDescendants(node) {
            const meshes = [];
            node.traverse((child) => {
                if (child.isMesh) meshes.push(child);
            });
            return meshes;
        }

        function resolveTargetNode(root, namePart) {
            const matches = [];
            root.traverse((node) => {
                if (!node.name) return;
                if (node.name.toLowerCase().includes(namePart.toLowerCase())) {
                    matches.push(node);
                }
            });
            if (!matches.length) return null;

            const meshMatch = matches.find((node) => node.isMesh);
            if (meshMatch) return meshMatch;

            // Prefer the deepest (most specific) named node when no mesh is directly named.
            matches.sort((a, b) => getNodeDepth(b) - getNodeDepth(a));
            return matches[0];
        }

        function buildAnnotations(root) {
            annotationSvg.innerHTML = "";
            annotationLabels.innerHTML = "";
            annotations.length = 0;

            const box = new THREE.Box3().setFromObject(root);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            annotationConfigs.forEach((config) => {
                const labelEl = document.createElement("div");
                labelEl.className = "annotationLabel";
                labelEl.textContent = config.label;
                annotationLabels.appendChild(labelEl);

                const lineEl = document.createElementNS("http://www.w3.org/2000/svg", "line");
                lineEl.classList.add("annotationLine");
                annotationSvg.appendChild(lineEl);

                let targetNode = null;
                if (config.targetNameIncludes) {
                    targetNode = resolveTargetNode(root, config.targetNameIncludes);
                }

                let fallbackWorld = null;
                if (!targetNode && config.fallbackFromBounds) {
                    fallbackWorld = new THREE.Vector3(
                        center.x + (size.x * config.fallbackFromBounds.x),
                        center.y + (size.y * config.fallbackFromBounds.y),
                        center.z + (size.z * config.fallbackFromBounds.z)
                    );
                }

                annotations.push({
                    config,
                    targetNode,
                    targetMeshes: targetNode ? collectMeshDescendants(targetNode) : [],
                    occlusionEnabled: config.enableOcclusion !== false
                        && (targetNode || config.enableOcclusionForFallback !== false),
                    fallbackWorld,
                    labelEl,
                    lineEl
                });
            });
        }

        function getWorldAnchor(annotation) {
            if (annotation.targetNode) {
                return annotation.targetNode.getWorldPosition(tmpWorldPoint);
            }
            if (annotation.fallbackWorld) {
                return tmpWorldPoint.copy(annotation.fallbackWorld);
            }
            return null;
        }

        function isOccluded(annotation, anchorWorld, padding = 0.05) {
            const direction = tmpWorldPoint.copy(anchorWorld).sub(camera.position);
            const targetDistance = direction.length();
            if (targetDistance <= 0.0001 || !occluderMeshes.length) return false;

            direction.normalize();
            raycaster.set(camera.position, direction);
            const hits = raycaster.intersectObjects(occluderMeshes, true);
            if (!hits.length) return false;

            for (const hit of hits) {
                if (hit.distance >= (targetDistance - padding)) {
                    return false;
                }
                if (annotation.targetMeshes.includes(hit.object)) {
                    continue;
                }
                return true;
            }
            return false;
        }

        function updateAnnotations() {
            if (!annotations.length) return;

            const rect = annotationLayer.getBoundingClientRect();
            annotations.forEach((annotation) => {
                const anchorWorld = getWorldAnchor(annotation);
                if (!anchorWorld) {
                    hideAnnotation(annotation);
                    return;
                }

                projectedPoint.copy(anchorWorld).project(camera);
                const inFrustum = projectedPoint.z > -1
                    && projectedPoint.z < 1
                    && projectedPoint.x > -1
                    && projectedPoint.x < 1
                    && projectedPoint.y > -1
                    && projectedPoint.y < 1;

                if (!inFrustum || (annotation.occlusionEnabled
                    && isOccluded(annotation, anchorWorld, annotation.config.occlusionPadding))) {
                    hideAnnotation(annotation);
                    return;
                }

                const pointX = (projectedPoint.x * 0.5 + 0.5) * rect.width;
                const pointY = (-projectedPoint.y * 0.5 + 0.5) * rect.height;
                const offsetX = annotation.config.labelOffset?.x ?? 64;
                const offsetY = annotation.config.labelOffset?.y ?? -44;
                const labelX = Math.min(Math.max(pointX + offsetX, 12), rect.width - 100);
                const labelY = Math.min(Math.max(pointY + offsetY, 12), rect.height - 34);

                annotation.labelEl.style.display = "block";
                annotation.lineEl.style.display = "block";
                annotation.labelEl.style.transform = `translate(${labelX}px, ${labelY}px)`;
                annotation.lineEl.setAttribute("x1", `${pointX}`);
                annotation.lineEl.setAttribute("y1", `${pointY}`);
                annotation.lineEl.setAttribute("x2", `${labelX - 8}`);
                annotation.lineEl.setAttribute("y2", `${labelY + 14}`);
            });
        }

        const loadingBaseText = "Loading model";
        let loadingDots = 1;
        statusEl.textContent = `${loadingBaseText}${".".repeat(loadingDots)}`;
        const loadingTextInterval = window.setInterval(() => {
            loadingDots = (loadingDots % 3) + 1;
            statusEl.textContent = `${loadingBaseText}${".".repeat(loadingDots)}`;
        }, 450);

        function stopLoadingTextAnimation() {
            window.clearInterval(loadingTextInterval);
        }

        const loader = new GLTFLoader();
        loader.load(
            "./Docs/Chariot_Model.glb",
            (gltf) => {
                const model = gltf.scene;
                scene.add(model);
                occluderMeshes = [];
                model.traverse((node) => {
                    if (node.isMesh) occluderMeshes.push(node);
                });
                frameModel(model);
                buildAnnotations(model);
                stopLoadingTextAnimation();
                statusEl.style.display = "none";
            },
            undefined,
            (error) => {
                console.error(error);
                stopLoadingTextAnimation();
                statusEl.textContent = "Failed to load model.";
            }
        );

        window.addEventListener("resize", () => {
            resizeRenderer();
        });

        function animate() {
            controls.update();
            updateAnnotations();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        resizeRenderer();
        animate();
    </script>
</body>
</html>
