<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin.css?v=2026-02-25-1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon:wght@400&display=swap" rel="stylesheet">
    <title>Schools Progress</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-api.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <header>
        <h1><span style="color: rgb(220, 56, 56);">Rampaging Chariots</span><br>Construction Tracking</h1>
        <h1>Admin</h1>
        <img id="logo" src="images/logo.svg" alt="Logo" onclick="window.location.href='./index.html'" style="cursor: pointer;">
    </header>

    <main>
        <div id="primary-buttons">
            <div>
                <div class="button-with-menu">
                    <button class="primary-buttons" style="margin-right: 2rem;">
                        <img class="icon buttonIcon" src="icons/add.png" alt="Add Icon"/>
                        <a>Add School</a>
                    </button>
                    <div class="hover-menu">
                        <input type="text" placeholder="School Name" class="menu-input" id="school-name-input">
                        <input type="text" placeholder="Set Password" class="menu-input" id="school-password-input">
                        <button class="submit-button">Add School</button>
                    </div>
                </div>
                <div class="button-with-menu">
                    <button class="primary-buttons">
                        <img class="icon buttonIcon" src="icons/remove.png" alt="Remove Icon"/>
                        <a>Remove School</a>
                    </button>
                    <div class="hover-menu">
                        <select class="menu-dropdown" id="remove-school-dropdown">
                            <option value="" disabled selected>Select a school</option>
                        </select>
                        <input type="text" placeholder="Password" class="menu-input" id="remove-school-password-input">
                        <button class="submit-button" id="remove-submit-button">Remove</button>
                    </div>
                </div>
            </div>
            <div>
                <div class="button-with-menu">
                    <button class="primary-buttons">
                        <img class="icon buttonIcon" src="icons/reset.png" alt="Reset Icon"/>
                        <a>Reset Progress</a>
                    </button>
                    <div class="hover-menu">
                        <input type="text" placeholder="Admin Password" class="menu-input" id="reset-admin-password-input">
                        <button class="submit-button" id="reset-submit-button">Clear All Progress</button>
                    </div>
                </div>
            </div>
        </div>
       <section>

       </section>
       <div id="error-message" style="display: none;">
           <p>Failed to load school data. Please try again later.</p>
       </div>
    </main>

    <script>
        const PROGRESS_TOTAL_STEPS = 31;
        const MESSAGE_CHECK_INTERVAL = 10000;
        const TOOLTIP_DELAY = 600;

        // ========================================
        // School Progress Display
        // ========================================

        /*
         * Calculates progress percentage for a school
         */
        function calculateProgressPercentage(progressArray) {
          const completedSteps = progressArray.filter(p => p.checked === true).length;
          const percentage = (completedSteps / PROGRESS_TOTAL_STEPS) * 100;
          return Math.min(percentage, 100);
        }

        /*
         * Creates a school progress card with message and edit buttons
         */
        function createSchoolProgressCard(school, progressPercentage) {
          const schoolDiv = document.createElement('div');
          schoolDiv.className = 'school-div';

          const schoolNameElement = document.createElement('span');
          schoolNameElement.className = 'school-name';
          schoolNameElement.textContent = school === 'Admin' ? 'Expected Progress' : school;

          const progressBar = document.createElement('div');
          progressBar.className = 'progress-bar';

          const progressFill = document.createElement('div');
          progressFill.className = 'progress-fill';
          progressFill.style.width = `${progressPercentage}%`;

          if (school === 'Admin') {
            progressFill.id = 'expected-progress';
          }

          const percentageLabel = document.createElement('span');
          percentageLabel.className = 'percentage-label';
          percentageLabel.textContent = `${Math.round(progressPercentage)}%`;

          progressBar.appendChild(progressFill);
          progressBar.appendChild(percentageLabel);

          schoolDiv.appendChild(schoolNameElement);
          schoolDiv.appendChild(progressBar);

          // Message button (not for Admin)
          if (school !== 'Admin') {
            const messageButton = document.createElement('button');
            messageButton.className = 'message-button';
            messageButton.id = `msg-${school}`;

            const messageIcon = document.createElement('img');
            messageIcon.src = 'icons/no-message.png';
            messageIcon.alt = 'Message Icon';
            messageIcon.className = 'icon noMsgs';
            messageIcon.id = school;
            messageButton.appendChild(messageIcon);

            schoolDiv.appendChild(messageButton);
          }

          // Edit button
          const editButton = document.createElement('button');
          editButton.className = 'edit-button';
          editButton.id = `edit-${school}`;

          const editIcon = document.createElement('img');
          editIcon.src = 'icons/arrow.png';
          editIcon.alt = 'Edit Icon';
          editIcon.className = 'icon';
          editButton.appendChild(editIcon);

          schoolDiv.appendChild(editButton);

          return schoolDiv;
        }

        /*
         * Fetches and displays all school progress
         */
        async function loadAndDisplaySchoolProgress() {
          const progressContainer = document.querySelector('section');

          try {
            const { key, adminKey: storedAdminKey } = RcAuth.getAuthSession();
            const adminKey = storedAdminKey || key;
            const schools = await RcApi.listSchoolProgress({
              adminKey
            });

            // Sort schools: Admin first, then by progress percentage (descending), then alphabetically
            schools.sort((schoolA, schoolB) => {
              const percentageA = calculateProgressPercentage(schoolA.progress);
              const percentageB = calculateProgressPercentage(schoolB.progress);

              if (schoolA.school === 'Admin') return -1;
              if (schoolB.school === 'Admin') return 1;

              if (percentageB !== percentageA) {
                return percentageB - percentageA;
              }

              return schoolA.school.localeCompare(schoolB.school);
            });

            // Create and append school progress cards
            schools.forEach(({ school, progress }) => {
              const percentage = calculateProgressPercentage(progress);
              const schoolCard = createSchoolProgressCard(school, percentage);
              progressContainer.appendChild(schoolCard);
            });

            // Populate remove school dropdown (exclude Admin)
            const removeDropdown = document.getElementById('remove-school-dropdown');
            schools.forEach(({ school }) => {
              if (school !== 'Admin') {
                const option = document.createElement('option');
                option.value = school;
                option.textContent = school;
                removeDropdown.appendChild(option);
              }
            });
          } catch (error) {
            console.error('Error fetching school progress:', error);
            document.getElementById('error-message').style.display = 'block';
          }
        }

        // ========================================
        // School Management Functions
        // ========================================

        /*
         * Attempts to add a new school
         */
        async function addNewSchool(schoolName, password, adminKey) {
          try {
            await RcApi.createSchool(adminKey, schoolName, password);
            alert(`School "${schoolName}" added successfully!`);
            document.getElementById('school-name-input').value = '';
            document.getElementById('school-password-input').value = '';
            location.reload();
          } catch (error) {
            console.error('Error adding school:', error);
            alert(error.message || 'An error occurred while adding the school.');
          }
        }

        /*
         * Attempts to remove a school
         */
        async function removeSchool(schoolName, password, adminKey) {
          try {
            const result = await RcApi.deleteSchool(adminKey, schoolName, password);
            alert(result.message || `School "${schoolName}" removed successfully!`);
            document.getElementById('remove-school-password-input').value = '';
            location.reload();
          } catch (error) {
            console.error('Error removing school:', error);
            alert(error.message || 'An error occurred while removing the school.');
          }
        }

        /*
         * Attempts to reset all school progress
         */
        async function resetAllProgress(adminPassword) {
          try {
            await RcApi.resetAllProgress(adminPassword);
            document.getElementById('reset-admin-password-input').value = '';
            location.reload();
          } catch (error) {
            console.error('Error resetting progress:', error);
            alert(error.message || 'An error occurred while resetting progress.');
          }
        }

        /*
         * Navigates to school progress editing page
         */
        async function editSchoolProgress(schoolName, adminKey) {
          if (schoolName === 'Admin') {
            RcAuth.setAuthSession({ school: schoolName, key: adminKey, adminKey });
            window.location.href = 'admin-progress.html';
            return;
          }

          const defaultPassword = schoolName.toLowerCase().replace(/\s+/g, '');
          const password = prompt(`Enter password for ${schoolName}:`, defaultPassword);

          if (!password) return;

          try {
            const result = await RcApi.verifySchoolPassword(schoolName, password);

            if (result.success) {
              RcAuth.setAuthSession({ school: schoolName, key: password, adminKey });
              window.location.href = 'school-progress.html';
            } else {
              alert('Incorrect password.');
            }
          } catch (error) {
            console.error('Error verifying password:', error);
            alert('Failed to verify password.');
          }
        }

        /*
         * Navigates to messages page for a school
         */
        function viewSchoolMessages(schoolName, adminKey) {
          const defaultPassword = schoolName.toLowerCase().replace(/\s+/g, '');
          const password = prompt(`Enter password for ${schoolName}:`, defaultPassword);

          if (password) {
            RcAuth.setAuthSession({ school: schoolName, key: password, adminKey });
            window.location.href = './documents.html';
          }
        }

        // ========================================
        // Tooltip Management
        // ========================================

        let globalTooltip;
        let currentMouseX = 0;
        let currentMouseY = 0;

        /*
         * Creates and initialises the global tooltip element
         */
        function initialiseTooltip() {
          globalTooltip = document.createElement('div');
          globalTooltip.className = 'tooltip';
          globalTooltip.style.display = 'none';
          document.body.appendChild(globalTooltip);

          document.addEventListener('mousemove', (e) => {
            currentMouseX = e.clientX;
            currentMouseY = e.clientY;
          });
        }

        /*
         * Attaches event listeners to button elements for tooltips and actions
         */
        function attachButtonListeners(adminKey) {
          document.querySelectorAll('.message-button').forEach(button => {
            const icon = button.querySelector('img');
            const schoolName = icon.id;

            button.addEventListener('click', () => {
              viewSchoolMessages(schoolName, adminKey);
            });

            addTooltipListeners(button, icon.classList.contains('gotMsgs') ? 'View new messages!' : 'No new messages');
          });

          document.querySelectorAll('.edit-button').forEach(button => {
            const buttonId = button.id.replace('edit-', '');

            button.addEventListener('click', () => {
              editSchoolProgress(buttonId, adminKey);
            });

            addTooltipListeners(button, 'View & Edit Progress');
          });
        }

        /*
         * Adds tooltip hover listeners to an element
         */
        function addTooltipListeners(element, tooltipText) {
          let tooltipTimeout;
          let isHovering = false;

          element.addEventListener('mouseover', () => {
            isHovering = true;
            clearTimeout(tooltipTimeout);
            tooltipTimeout = setTimeout(() => {
              if (isHovering && globalTooltip) {
                globalTooltip.textContent = tooltipText;
                globalTooltip.style.display = 'block';
                updateTooltipPosition();
              }
            }, TOOLTIP_DELAY);
          });

          element.addEventListener('mousemove', updateTooltipPosition);

          element.addEventListener('mouseout', () => {
            isHovering = false;
            clearTimeout(tooltipTimeout);
            if (globalTooltip) globalTooltip.style.display = 'none';
          });
        }

        /*
         * Updates tooltip position to follow mouse
         */
        function updateTooltipPosition() {
          if (globalTooltip && globalTooltip.style.display === 'block') {
            globalTooltip.style.left = (currentMouseX + 8) + 'px';
            globalTooltip.style.top = (currentMouseY + 25) + 'px';
          }
        }

        // ========================================
        // Message Status Polling
        // ========================================

        /*
         * Checks for unviewed comments and updates message icons
         */
        async function checkUnviewedComments(adminKey) {
          try {
            const unviewedBySchool = await RcApi.getUnviewedComments(adminKey, 'school');

            // Update icons for schools with unviewed comments
            Object.keys(unviewedBySchool).forEach(schoolName => {
              const messageIcon = document.getElementById(schoolName);
              if (messageIcon) {
                messageIcon.className = 'icon gotMsgs';
                messageIcon.src = 'icons/messageRed.png';
              }
            });

            // Reset icons for schools without unviewed comments
            document.querySelectorAll('.noMsgs, .gotMsgs').forEach(icon => {
              const schoolName = icon.id;
              if (!unviewedBySchool[schoolName]) {
                icon.className = 'icon noMsgs';
                icon.src = 'icons/no-message.png';
              }
            });
          } catch (error) {
            console.error('Error checking unviewed comments:', error);
          }
        }

        // ========================================
        // Initialisation
        // ========================================

        document.addEventListener('DOMContentLoaded', async () => {
          const auth = RcAuth.requireAuthSession({ adminOnly: true });
          if (!auth) return;

          const adminKey = auth.adminKey || auth.key;

          // Load school progress
          await loadAndDisplaySchoolProgress();

          // Initialise tooltip system
          initialiseTooltip();
          attachButtonListeners(adminKey);

          // Setup remove school dropdown
          const removeDropdown = document.getElementById('remove-school-dropdown');
          const removeSubmitButton = document.getElementById('remove-submit-button');

          removeDropdown.addEventListener('change', (e) => {
            removeSubmitButton.textContent = e.target.value ? `Remove ${e.target.value}` : 'Remove School';
          });

          removeSubmitButton.addEventListener('click', () => {
            const schoolName = removeDropdown.value;
            const password = document.getElementById('remove-school-password-input').value.trim();

            if (!schoolName || !password) return;
            removeSchool(schoolName, password, adminKey);
          });

          // Setup add school functionality
          const addSchoolButton = document.querySelector('.button-with-menu:nth-of-type(1) .submit-button');
          addSchoolButton.addEventListener('click', () => {
            const schoolName = document.getElementById('school-name-input').value.trim();
            const password = document.getElementById('school-password-input').value.trim();

            if (!schoolName || !password) {
              alert('Please enter both school name and password.');
              return;
            }
            addNewSchool(schoolName, password, adminKey);
          });

          // Setup reset progress functionality
          const resetButton = document.getElementById('reset-submit-button');
          resetButton.addEventListener('click', () => {
            const password = document.getElementById('reset-admin-password-input').value.trim();
            if (!password) return;
            resetAllProgress(password);
          });

          // Start polling for unviewed comments
          if (adminKey) {
            checkUnviewedComments(adminKey);
            setInterval(() => checkUnviewedComments(adminKey), MESSAGE_CHECK_INTERVAL);
          }
        });
    </script>
    
</body>
</html>
