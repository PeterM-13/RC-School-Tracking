<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon:wght@400&display=swap" rel="stylesheet">
    <title>Schools Progress</title>
</head>
<body>
    <header>
        <h1><span style="color: rgb(220, 56, 56);">Rampaging Chariots</span><br>Construction Tracking</h1>
        <h1>Admin</h1>
        <img id="logo" src="images/logo.svg" alt="Logo">
    </header>

    <main>
        <div id="primary-buttons">
            <div>
                <div class="button-with-menu">
                    <button class="primary-buttons" style="margin-right: 2rem;">
                        <img class="icon buttonIcon" src="icons/add.png" alt="Add Icon"/>
                        <a>Add School</a>
                    </button>
                    <div class="hover-menu">
                        <input type="text" placeholder="School Name" class="menu-input" id="school-name-input">
                        <input type="text" placeholder="Set Password" class="menu-input" id="school-password-input">
                        <button class="submit-button">Add School</button>
                    </div>
                </div>
                <div class="button-with-menu">
                    <button class="primary-buttons">
                        <img class="icon buttonIcon" src="icons/remove.png" alt="Remove Icon"/>
                        <a>Remove School</a>
                    </button>
                    <div class="hover-menu">
                        <select class="menu-dropdown" id="remove-school-dropdown">
                            <option value="" disabled selected>Select a school</option>
                        </select>
                        <input type="text" placeholder="Password" class="menu-input" id="remove-school-password-input">
                        <button class="submit-button" id="remove-submit-button">Remove</button>
                    </div>
                </div>
            </div>
            <div>
                <div class="button-with-menu">
                    <button class="primary-buttons">
                        <img class="icon buttonIcon" src="icons/reset.png" alt="Reset Icon"/>
                        <a>Reset Progress</a>
                    </button>
                    <div class="hover-menu">
                        <input type="text" placeholder="Admin Password" class="menu-input" id="reset-admin-password-input">
                        <button class="submit-button" id="reset-submit-button">Clear All Progress</button>
                    </div>
                </div>
            </div>
        </div>
       <section>

       </section>
       <div id="error-message" style="display: none;">
           <p>Failed to load school data. Please try again later.</p>
       </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const progressContainer = document.getElementsByTagName('section')[0];
            const removeSchoolDropdown = document.getElementById('remove-school-dropdown');
            const removeSubmitButton = document.getElementById('remove-submit-button');
            const urlParams = new URLSearchParams(window.location.search);
            const adminKey = urlParams.get('key');

            // Update remove button text when school is selected
            removeSchoolDropdown.addEventListener('change', (e) => {
                const selectedSchool = e.target.value;
                if (selectedSchool) {
                    removeSubmitButton.textContent = `Remove ${selectedSchool}`;
                } else {
                    removeSubmitButton.textContent = 'Remove School';
                }
            });

            try {
                const response = await fetch('https://rc-school-tracking.onrender.com/school-progress-all');
                const schools = await response.json();

                // Populate remove school dropdown
                schools.forEach(({ school }) => {
                    if (school !== 'Admin') {
                        const option = document.createElement('option');
                        option.value = school;
                        option.textContent = school;
                        removeSchoolDropdown.appendChild(option);
                    }
                });


                // Sort schools by progress percentage in descending order
                schools.sort((a, b) => {
                    const progressA = (a.progress.filter(p => p === 1).length / 31) * 100;
                    const progressB = (b.progress.filter(p => p === 1).length / 31) * 100;

                    // Check if progress matches "Admin" (expected progress)
                    if (a.school === 'Admin') return -1;
                    if (b.school === 'Admin') return 1;

                    // Sort by progress percentage, then alphabetically if percentages are equal
                    if (progressB === progressA) {
                        return a.school.localeCompare(b.school);
                    }

                    return progressB - progressA;
                });

                schools.forEach(({ school, progress }) => {
                    let percentage = (progress.filter(p => p === 1).length / 31) * 100;

                    // Ensure percentage does not exceed 100
                    percentage = Math.min(percentage, 100);

                    const schoolDiv = document.createElement('div');
                    schoolDiv.className = 'school-div';

                    const schoolName = document.createElement('span');
                    schoolName.className = 'school-name';
                    schoolName.textContent = school === 'Admin' ? 'Expected Progress' : school;

                    const progressBar = document.createElement('div');
                    progressBar.className = 'progress-bar';

                    const messageButton = document.createElement('button');
                    messageButton.className = 'message-button';

                    const messageIcon = document.createElement('img');
                    messageIcon.src = 'icons/no-message.png';
                    messageIcon.alt = 'Message Icon';
                    messageIcon.className = 'icon noMsgs';
                    messageIcon.id = `${school}`;
                    messageButton.appendChild(messageIcon);

                    const editButton = document.createElement('button');
                    editButton.className = 'edit-button';
                    editButton.id = school

                    const editIcon = document.createElement('img');
                    editIcon.src = 'icons/arrow.png';
                    editIcon.alt = 'Edit Icon';
                    editIcon.className = 'icon';
                    editButton.appendChild(editIcon);

                    // Add click event listener for navigation
                    editButton.addEventListener('click', () => {
                        const selectedSchool = editButton.id;
                        const urlParams = new URLSearchParams(window.location.search);
                        const adminKey = urlParams.get('key');
                        let password;
                        
                        // For Admin school, get password from URL instead of prompting
                        if (selectedSchool === 'Admin') {
                            password = adminKey;
                            
                            if (password) {
                                window.location.href = 'school-progress.html?school=' + selectedSchool + '&key=' + password + '&adminKey=' + adminKey;
                            }
                        } else {
                            const defaultPassword = selectedSchool.toLowerCase().replace(/\s+/g, '');
                            password = prompt(`Enter password for ${selectedSchool}:`, defaultPassword);
                            
                            if (password) {
                                window.location.href = 'school-progress.html?school=' + selectedSchool + '&key=' + password + '&adminKey=' + adminKey;
                            }
                        }
                    });

                    const progressFill = document.createElement('div');
                    progressFill.className = 'progress-fill';
                    progressFill.style.width = `${percentage}%`;

                    // Assign id 'expected' if the school name is 'Admin'
                    if (school === 'Admin') {
                        progressFill.id = 'expected';
                    }

                    const percentageLabel = document.createElement('span');
                    percentageLabel.className = 'percentage-label';
                    percentageLabel.textContent = `${Math.round(percentage)}%`;

                    progressBar.appendChild(progressFill);
                    progressBar.appendChild(percentageLabel);

                    schoolDiv.appendChild(schoolName);
                    schoolDiv.appendChild(progressBar);
                    schoolDiv.appendChild(messageButton);
                    schoolDiv.appendChild(editButton);
                    progressContainer.appendChild(schoolDiv);
                });
            } catch (error) {
                console.error('Error fetching school progress:', error);
                document.getElementById('error-message').style.display = 'block';
            }

            // Reset All Progress functionality
            const resetSubmitButton = document.getElementById('reset-submit-button');
            const resetAdminPasswordInput = document.getElementById('reset-admin-password-input');

            resetSubmitButton.addEventListener('click', async () => {
                const adminPassword = resetAdminPasswordInput.value.trim();

                if (!adminPassword) {
                    return;
                }

                try {
                    const response = await fetch('https://rc-school-tracking.onrender.com/reset-all-progress', {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            password: adminPassword
                        })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        resetAdminPasswordInput.value = '';
                        location.reload();
                    } else {
                        alert(result.error || 'Failed to reset progress');
                    }
                } catch (error) {
                    console.error('Error resetting progress:', error);
                    alert('An error occurred while resetting progress.');
                }
            });

            // Add School functionality
            const addSchoolButton = document.querySelector('#school-name-input').parentElement.querySelector('.submit-button');
            const schoolNameInput = document.getElementById('school-name-input');
            const schoolPasswordInput = document.getElementById('school-password-input');

            addSchoolButton.addEventListener('click', async () => {
                const schoolName = schoolNameInput.value.trim();
                const password = schoolPasswordInput.value.trim();

                if (!schoolName || !password) {
                    alert('Please enter both school name and password.');
                    return;
                }

                try {
                    const response = await fetch('https://rc-school-tracking.onrender.com/school', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: schoolName,
                            password: password
                        })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        alert(`School "${schoolName}" added successfully!`);
                        schoolNameInput.value = '';
                        schoolPasswordInput.value = '';
                        location.reload(); // Reload to show new school
                    } else {
                        alert(result.error || 'Failed to add school');
                    }
                } catch (error) {
                    console.error('Error adding school:', error);
                    alert('An error occurred while adding the school.');
                }
            });

            // Remove School functionality
            const removeSchoolPasswordInput = document.getElementById('remove-school-password-input');

            removeSubmitButton.addEventListener('click', async () => {
                const selectedSchool = removeSchoolDropdown.value;
                const password = removeSchoolPasswordInput.value.trim();

                if (!selectedSchool || !password) {
                    return;
                }

                try {
                    const response = await fetch('https://rc-school-tracking.onrender.com/school', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: selectedSchool,
                            password: password
                        })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        alert(result.message || `School "${selectedSchool}" removed successfully!`);
                        removeSchoolPasswordInput.value = '';
                        location.reload(); // Reload to update list
                    } else {
                        alert(result.error || 'Failed to remove school');
                    }
                } catch (error) {
                    console.error('Error removing school:', error);
                    alert('An error occurred while removing the school.');
                }
            });

            // Poll for unviewed comments every 6 seconds
            if (adminKey) {
                // Create a global tooltip element
                const globalTooltip = document.createElement('div');
                globalTooltip.className = 'tooltip';
                globalTooltip.style.display = 'none';
                document.body.appendChild(globalTooltip);
                
                let currentMouseX = 0;
                let currentMouseY = 0;
                
                // Track global mouse position
                document.addEventListener('mousemove', (e) => {
                    currentMouseX = e.clientX;
                    currentMouseY = e.clientY;
                });
                
                // Function to add event listeners to message buttons and tooltips
                const attachMessageButtonListeners = () => {
                    document.querySelectorAll('.message-button').forEach(button => {
                        const icon = button.querySelector('img');
                        const schoolName = icon.id;
                        
                        // Remove old listener if exists by cloning
                        const newButton = button.cloneNode(true);
                        button.parentNode.replaceChild(newButton, button);
                        
                        const newIcon = newButton.querySelector('img');
                        let tooltipTimeout;
                        let isHovering = false;
                        
                        // Add click listener for gotMsgs buttons
                        newButton.addEventListener('click', () => {
                            if (newIcon.classList.contains('gotMsgs')) {
                                const defaultPassword = schoolName.toLowerCase().replace(/\s+/g, '');
                                const password = prompt(`Enter password for ${schoolName}:`, defaultPassword);
                                if (password) {
                                    window.location.href = `./documents.html?school=${encodeURIComponent(schoolName)}&key=${encodeURIComponent(password)}&adminKey=${encodeURIComponent(adminKey)}`;
                                }
                            }
                        });
                        
                        // Add tooltip listeners with delay
                        newButton.addEventListener('mouseover', () => {
                            isHovering = true;
                            clearTimeout(tooltipTimeout);
                            tooltipTimeout = setTimeout(() => {
                                if (isHovering) {
                                    const tooltipText = newIcon.classList.contains('gotMsgs') ? 'View new messages!' : 'No new messages';
                                    globalTooltip.textContent = tooltipText;
                                    globalTooltip.style.display = 'block';
                                    globalTooltip.style.left = (currentMouseX + 8) + 'px';
                                    globalTooltip.style.top = (currentMouseY + 25) + 'px';
                                }
                            }, 600); // 500ms delay
                        });
                        
                        newButton.addEventListener('mousemove', (e) => {
                            if (globalTooltip.style.display === 'block') {
                                globalTooltip.style.left = (e.clientX + 8) + 'px';
                                globalTooltip.style.top = (e.clientY + 25) + 'px';
                            }
                        });
                        
                        newButton.addEventListener('mouseout', () => {
                            isHovering = false;
                            clearTimeout(tooltipTimeout);
                            globalTooltip.style.display = 'none';
                        });
                    });
                    
                    // Add tooltip listeners to edit buttons
                    document.querySelectorAll('.edit-button').forEach(button => {
                        let tooltipTimeout;
                        let isHovering = false;
                        
                        button.addEventListener('mouseover', () => {
                            isHovering = true;
                            clearTimeout(tooltipTimeout);
                            tooltipTimeout = setTimeout(() => {
                                if (isHovering) {
                                    globalTooltip.textContent = 'View & Edit Progress';
                                    globalTooltip.style.display = 'block';
                                    globalTooltip.style.left = (currentMouseX + 8) + 'px';
                                    globalTooltip.style.top = (currentMouseY + 25) + 'px';
                                }
                            }, 600); // 600ms delay
                        });
                        
                        button.addEventListener('mousemove', (e) => {
                            if (globalTooltip.style.display === 'block') {
                                globalTooltip.style.left = (e.clientX + 8) + 'px';
                                globalTooltip.style.top = (e.clientY + 25) + 'px';
                            }
                        });
                        
                        button.addEventListener('mouseout', () => {
                            isHovering = false;
                            clearTimeout(tooltipTimeout);
                            globalTooltip.style.display = 'none';
                        });
                    });
                };
                
                // Attach listeners initially
                attachMessageButtonListeners();
                
                // Function to check unviewed comments
                const checkUnviewedComments = async () => {
                    try {
                        const response = await fetch(`https://rc-school-tracking.onrender.com/unviewed-comments?adminKey=${encodeURIComponent(adminKey)}&sent-by=school`);
                        if (!response.ok) return;
                        const unviewedBySchool = await response.json();
                        
                        // Update message icons based on unviewed comments
                        Object.keys(unviewedBySchool).forEach(schoolName => {
                            const messageIcon = document.getElementById(schoolName);
                            if (messageIcon) {
                                messageIcon.className = 'icon gotMsgs';
                                messageIcon.src = 'icons/messageRed.png';
                            }
                        });
                        
                        // Reset schools with no unviewed comments
                        document.querySelectorAll('.noMsgs, .gotMsgs').forEach(icon => {
                            const schoolName = icon.id;
                            if (!unviewedBySchool[schoolName]) {
                                icon.className = 'icon noMsgs';
                                icon.src = 'icons/no-message.png';
                            }
                        });
                        
                        // Re-attach listeners after UI update
                        attachMessageButtonListeners();
                    } catch (error) {
                        console.error('Error checking unviewed comments:', error);
                    }
                };
                
                // Check immediately on page load
                checkUnviewedComments();
                
                // Then check every 10 seconds
                setInterval(checkUnviewedComments, 10000);
            }
        });
    </script>
    
</body>
</html>
